name: Release Standalone Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Portable Windows Application & Single-File Installer
        run: |
          python execution/build_exe.py

      - name: Verify Distribution Files
        shell: pwsh
        run: |
          if (Test-Path "dist/GenshinAbyssStudio-Windows-x64.zip") {
            $zipSize = (Get-Item "dist/GenshinAbyssStudio-Windows-x64.zip").Length / 1MB
            Write-Host "Portable Zip ready: $zipSize MB"
          } else {
            Write-Error "dist/GenshinAbyssStudio-Windows-x64.zip was not generated!"
            exit 1
          }
          if (Test-Path "dist/GenshinAbyssStudio-Setup.exe") {
            $setupSize = (Get-Item "dist/GenshinAbyssStudio-Setup.exe").Length / 1MB
            Write-Host "Setup Installer ready: $setupSize MB"
          }

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: Genshin Abyss Studio ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 🎬 Genshin Impact Spiral Abyss Studio - Production Release
            
            ### 🚀 Quick Start (Choose One):
            
            #### 🌟 Option A: 1-Click Installer (Recommended)
            1. Download **`GenshinAbyssStudio-Setup.exe`**.
            2. Run it to install in 2 seconds (creates Desktop + Start Menu shortcuts, zero admin permissions needed).
            3. Launch and enjoy!
            
            #### 📦 Option B: Standalone Portable ZIP
            1. Download **`GenshinAbyssStudio-Windows-x64.zip`**.
            2. Extract anywhere on your PC and double-click **`GenshinAbyssStudio.exe`**.
            
            ---
            ### ✨ Included Features & Capabilities
            - **Canva-Style 1080p Thumbnail Designer**: Complete 130+ character roster, official HoYoWiki art filmstrip, and interactive canvas cropping.
            - **40-Step History Engine**: Full undo/redo snapshot stack (`Ctrl + Z` / `Ctrl + Y`) for frictionless thumbnail composition.
            - **.abyss Project Persistence**: Self-contained project files for saving and loading workspace configurations.
            - **Multi-Format Export Presets**: Lossless PNG, Web-Optimized JPEG (guaranteed < 2MB), and transparent roster overlay for OBS.
            - **Automated CapCut PC Video Editor**: Intelligent multi-signal loading screen detection, 7-cut assembly, and native draft generator.
            - **Explainable BGM Intelligence Engine**: Multi-criteria combat-to-soundtrack duration matching with energy tags and SHA-256 fingerprints.
            - **Microsecond YouTube Chapter Generator**: Automated floor/chamber timecodes for YouTube Studio.
          files: |
            dist/GenshinAbyssStudio-Setup.exe
            dist/GenshinAbyssStudio-Windows-x64.zip
